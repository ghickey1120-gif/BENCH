<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench — in-game tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench">
<meta name="theme-color" content="#0B0B0E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Westbrook: purple #3C2478, white, black */
  --bg:#F2F1F5; --panel:#FFFFFF; --panel2:#F6F5F9; --edge:#D9D6E2;
  --text:#0B0B0E; --dim:#6A6878; --accent:#3C2478; --accent-soft:#EAE4F7;
  --btn:#3C2478; --on-btn:#FFFFFF; --contrast:#0B0B0E; --on-contrast:#FFFFFF; --danger:#B3302A;
  --shadow:0 1px 2px rgba(20,16,34,.10), 0 6px 18px rgba(20,16,34,.07);
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0E; --panel:#15151B; --panel2:#1D1D26; --edge:#302F3D;
    --text:#F4F3F7; --dim:#9997A8; --accent:#A98CF4; --accent-soft:#241745;
    --btn:#4A2A9E; --on-btn:#FFFFFF; --contrast:#F4F3F7; --on-contrast:#0B0B0E; --danger:#E8705E;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0E; --panel:#15151B; --panel2:#1D1D26; --edge:#302F3D;
  --text:#F4F3F7; --dim:#9997A8; --accent:#A98CF4; --accent-soft:#241745;
  --btn:#4A2A9E; --on-btn:#FFFFFF; --contrast:#F4F3F7; --on-contrast:#0B0B0E; --danger:#E8705E;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--text);
  font-family:Barlow, "Helvetica Neue", Arial, sans-serif; font-size:16px; line-height:1.4;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-family:"Barlow Condensed", Barlow, sans-serif; font-variant-numeric:tabular-nums}

.app{min-height:100%; display:flex; flex-direction:column; gap:10px; padding:10px; max-width:1500px; margin:0 auto}

/* ---------- header ---------- */
.bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--edge); border-radius:var(--r);
  padding:8px 10px; box-shadow:var(--shadow);
}
.crest{display:flex; align-items:center; justify-content:center; background:#0B0B0E;
  border-radius:10px; padding:5px 8px; flex:0 0 auto}
.crest img{height:34px; width:auto; display:block}
@media (max-width:520px){ .crest img{height:26px} }
.matchup{display:flex; flex-direction:column; min-width:0; margin-right:auto}
.matchup input{
  font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:24px; line-height:1.1;
  background:none; border:none; color:var(--text); padding:0; width:min(44vw,250px);
}
.matchup input::placeholder{color:var(--dim)}
.matchup .sub{font-size:12px; color:var(--dim)}
.periods{display:flex; gap:4px; background:var(--panel2); padding:4px; border-radius:11px; border:1px solid var(--edge)}
.periods button{
  min-width:44px; height:40px; border-radius:8px; font-family:"Barlow Condensed",sans-serif;
  font-weight:600; font-size:19px; color:var(--dim);
}
.periods button[aria-pressed="true"]{background:var(--btn); color:var(--on-btn)}
.tool{
  height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--edge);
  background:var(--panel2); font-size:15px; font-weight:500; white-space:nowrap;
}
.tool:disabled{opacity:.4}
.tool.timeout{background:var(--btn); border-color:transparent; color:var(--on-btn); font-weight:600}
.tool.undo{display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:0 12px; line-height:1.1}
.tool.undo small{font-size:11px; color:var(--dim); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------- panels ---------- */
main{flex:1; display:grid; gap:10px; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start}
@media (max-width:840px){ main{grid-template-columns:1fr} }
.card{
  background:var(--panel); border:1px solid var(--edge); border-radius:var(--r);
  box-shadow:var(--shadow); padding:10px 12px 14px;
}
.card > header{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
.card h2{margin:0; font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:18px; letter-spacing:.02em}
.card header .spacer{margin-left:auto}
.tally{font-family:"Barlow Condensed",sans-serif; font-size:17px; color:var(--dim)}
.tally b{color:var(--text); font-weight:600}
.scope{display:flex; gap:3px; background:var(--panel2); border:1px solid var(--edge); border-radius:9px; padding:3px}
.scope button{padding:5px 10px; border-radius:7px; font-size:13px; color:var(--dim)}
.scope button[aria-pressed="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
.group{margin-top:14px}
.group:first-of-type{margin-top:0}
.group h3{
  margin:0 0 6px; font-family:"Barlow Condensed",sans-serif; font-size:14px; font-weight:600;
  color:var(--dim); letter-spacing:.06em;
}
.grid{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.grid.two{grid-template-columns:repeat(2,1fr)}
.grid.three{grid-template-columns:repeat(3,1fr)}
.callwrap{position:relative}
.call{
  width:100%; border-radius:13px; border:1px solid var(--edge); background:var(--panel2);
  display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between;
  padding:9px 11px 7px; gap:1px; transition:transform .06s ease, background .12s ease;
  min-height:86px;
}
.call:active{transform:scale(.97); background:var(--accent-soft)}
.call .label{font-size:14px; font-weight:500; text-align:left; line-height:1.15; padding-right:26px}
.call .n{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:38px; line-height:.95; color:var(--accent)}
.call.zero .n{color:var(--dim); opacity:.5}
.call .sub{font-size:12px; color:var(--dim); line-height:1.2}
.call.big{min-height:116px}
.call.big .label{font-family:"Barlow Condensed",sans-serif; font-size:28px; font-weight:700}
.call.big .n{font-size:32px}
.minus{
  position:absolute; top:4px; right:4px; width:32px; height:32px; border-radius:8px;
  color:var(--dim); font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center;
}
.minus:active{background:var(--edge)}
.flash{animation:pop .35s ease}
@keyframes pop{0%{background:var(--accent-soft)}100%{background:var(--panel2)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none} .call{transition:none}}

/* ---------- the follow-up question ---------- */
#askbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--panel); border-top:1px solid var(--edge);
  box-shadow:0 -6px 24px rgba(0,0,0,.18);
}
#askbar[hidden]{display:none}
.askwrap{max-width:720px; margin:0 auto}
.askq{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:15px}
.askq b{font-family:"Barlow Condensed",sans-serif; font-size:24px; font-weight:700}
.askq .cancel{margin-left:auto; width:38px; height:34px; border-radius:8px; border:1px solid var(--edge); color:var(--dim)}
.askrow{display:flex; gap:10px}
.askrow button{
  flex:1; height:64px; border-radius:13px; font-family:"Barlow Condensed",sans-serif;
  font-weight:700; font-size:25px;
}
.askrow .good{background:var(--btn); color:var(--on-btn)}
.askrow .bad{background:var(--contrast); color:var(--on-contrast)}
body.asking .app{padding-bottom:160px}

/* ---------- sheets ---------- */
.sheet{position:fixed; inset:0; background:rgba(8,10,14,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center}
.sheet[hidden]{display:none}
.sheet .inner{
  background:var(--bg); width:100%; max-width:820px; max-height:92%; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--edge);
}
@media (min-width:700px){.sheet{align-items:center} .sheet .inner{border-radius:18px; max-height:88%}}
.sheet h2{font-family:"Barlow Condensed",sans-serif; margin:0; font-size:22px}
.sheethead{display:flex; align-items:center; gap:10px; margin-bottom:12px; position:sticky; top:-14px; background:var(--bg); padding:4px 0 8px}
.sheethead .spacer{margin-left:auto}
.block{background:var(--panel); border:1px solid var(--edge); border-radius:var(--r); padding:12px; margin-bottom:12px}
.block h3{margin:0 0 8px; font-family:"Barlow Condensed",sans-serif; font-size:15px; letter-spacing:.04em; color:var(--dim)}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{padding:6px; text-align:right; border-bottom:1px solid var(--edge)}
th:first-child,td:first-child{text-align:left}
th{font-weight:500; color:var(--dim); font-size:12px}
tbody tr:last-child td{border-bottom:none; font-weight:600}
td.n{font-family:"Barlow Condensed",sans-serif; font-size:16px}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.chips button{padding:9px 13px; border-radius:99px; border:1px solid var(--edge); background:var(--panel); font-size:14px; color:var(--dim)}
.chips button[aria-pressed="true"]{background:var(--text); color:var(--bg); border-color:transparent; font-weight:500}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:8px; margin-bottom:12px}
.tile{background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:9px 11px}
.tile .k{display:block; font-size:12px; color:var(--dim); line-height:1.2}
.tile b{display:block; font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:31px; line-height:1.05}
.tile .s{font-size:12px; color:var(--dim)}
.huddle{background:var(--accent-soft); border:1px solid var(--edge); border-radius:var(--r); padding:12px; margin-bottom:12px}
.huddle h3{margin:0 0 6px; font-family:"Barlow Condensed",sans-serif; font-size:15px; letter-spacing:.04em; color:var(--dim)}
.huddle ul{margin:0; padding-left:18px}
.huddle li{margin:3px 0; line-height:1.35}
.row{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
.row label{font-size:13px; color:var(--dim); min-width:108px}
input[type=text],select{
  flex:1; min-width:120px; height:42px; padding:0 10px; border-radius:10px;
  border:1px solid var(--edge); background:var(--panel2); color:var(--text); font:inherit;
}
.btn{height:46px; padding:0 16px; border-radius:11px; border:1px solid var(--edge); background:var(--panel2); font-weight:500}
.btn.primary{background:var(--btn); border-color:transparent; color:var(--on-btn); font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.btn.danger[data-armed="1"]{background:var(--danger); color:#FFFFFF; border-color:transparent}
.btns{display:flex; gap:8px; flex-wrap:wrap}
.namelist{display:flex; flex-direction:column; gap:8px}
.nameitem{display:flex; gap:8px; align-items:center}
.nameitem .btn{height:42px; padding:0 12px}
.note{font-size:13px; color:var(--dim); margin:8px 0 0}
.gamelist{display:flex; flex-direction:column; gap:6px}
.gameitem{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px; border:1px solid var(--edge); border-radius:10px; background:var(--panel2)}
.gameitem .who{flex:1; min-width:0}
.gameitem .who b{display:block; font-weight:600}
.gameitem .who span{font-size:12px; color:var(--dim)}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--text); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:14px; z-index:80;
}
.toast[hidden]{display:none}

@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#fff;--edge:#bbb;--text:#000;--dim:#444;--accent:#3C2478;
        --accent-soft:#fff;--btn:#3C2478;--on-btn:#fff;--contrast:#000;--on-contrast:#fff;--danger:#8a2a1a;--shadow:none;padding:0}
  body{background:#fff}
  .app,.toast,#settings,#askbar{display:none !important}
  .sheet{position:static; inset:auto; background:none; display:block}
  .sheet[hidden]{display:none !important}
  .sheet .inner{max-width:none; max-height:none; overflow:visible; border:none; border-radius:0; padding:0}
  .sheethead{position:static}
  .sheethead .btn,.chips,#reportactions{display:none !important}
  .block,.tiles,.huddle{break-inside:avoid; page-break-inside:avoid}
}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================ state ============================ */
const KEY = 'bench-tracker-v2';
const DEFAULTS = {
  version: 2,
  config: {
    periodStyle: 'quarters',
    defenses: ['13','21','23','1'],
    triggers: ['Get','Away','Pick'],
    sets: ['Even','Odd'],
    blobs: ['Barca','Miami']
  },
  games: [],
  currentId: null
};
const LIST_OF = {defense:'defenses', trigger:'triggers', set:'sets', blob:'blobs'};

let state = load();
let ask = null;                 // {kind:'defense'|'play', name, type}
let scope = 'game';
let storageWorks = true;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (s && s.games){
        s.config = Object.assign({}, DEFAULTS.config, s.config || {});
        return s;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    storageWorks = true;
  }catch(e){
    if (storageWorks){ storageWorks = false; toast('This browser will not save — back up before closing'); }
  }
}
function newGame(){
  const g = {id:'g'+Date.now(), opponent:'', date:new Date().toISOString(), period:1, events:[]};
  state.games.unshift(g);
  state.currentId = g.id;
  save();
  return g;
}
function game(){
  let g = state.games.find(x => x.id === state.currentId);
  if (!g) g = newGame();
  return g;
}
if (!state.games.length || !state.currentId) newGame();

const cfg = () => state.config;
const periodNames = () => cfg().periodStyle === 'halves' ? ['1','2','OT'] : ['1','2','3','4','OT'];
const periodLabel = p => {
  const n = periodNames()[p-1] || String(p);
  return n === 'OT' ? 'OT' : (cfg().periodStyle === 'halves' ? 'H' : 'Q') + n;
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b) => b ? Math.round(a*1000/b)/10 + '%' : '—';

/* ============================ events ============================ */
function log(ev){
  const g = game();
  ev.t = Date.now();
  ev.period = g.period;
  g.events.push(ev);
  save();
  render();
}
function describe(ev){
  if (!ev) return '';
  if (ev.type === 'break') return 'the ' + ev.name + ' marker';
  if (ev.type === 'defense') return ev.name + ' · ' + (ev.stop ? 'stop' : 'score');
  if (ev.type === 'set' || ev.type === 'blob') return ev.name + ' · ' + (ev.open ? 'open shot' : 'no open shot');
  return ev.name;
}
function undo(){
  const g = game();
  if (!g.events.length) return;
  const ev = g.events.pop();
  save(); render();
  toast('Removed ' + describe(ev));
}
const plain = g => g.events.filter(e => e.type !== 'break');
const nEntries = g => plain(g).length;
const inScope = e => scope === 'game' || e.period === game().period;
const pickEvents = (kind, name) =>
  plain(game()).filter(e => e.type === kind && (name === undefined || e.name === name) && inScope(e));

function removeLast(kind, name){
  const g = game();
  for (let i = g.events.length-1; i >= 0; i--){
    const e = g.events[i];
    if (e.type === kind && e.name === name && inScope(e)){
      g.events.splice(i,1); save(); render();
      toast('Removed one ' + name);
      return;
    }
  }
  toast('Nothing to remove');
}

/* breaks split the game into segments you can report on */
function markBreak(kind, name){
  const g = game();
  if (!g.events.length) return false;
  const last = g.events[g.events.length-1];
  if (last && last.type === 'break'){
    if (kind === 'period' && last.kind !== 'period'){ last.kind = kind; last.name = name; save(); }
    return false;
  }
  g.events.push({t:Date.now(), period:g.period, type:'break', kind:kind, name:name});
  save();
  return true;
}
function segmentsOf(g){
  const segs = [{label:'tip-off', events:[]}];
  g.events.forEach(e => {
    if (e.type === 'break') segs.push({label:e.name, events:[]});
    else segs[segs.length-1].events.push(e);
  });
  return segs;
}
function liveSegment(g){
  const segs = segmentsOf(g);
  for (let i = segs.length-1; i >= 0; i--) if (segs[i].events.length) return segs[i];
  return segs[0];
}

/* ============================ the follow-up question ============================ */
function renderAsk(){
  const bar = $('askbar');
  if (!ask){ bar.hidden = true; document.body.classList.remove('asking'); return; }
  const isDef = ask.kind === 'defense';
  bar.hidden = false;
  document.body.classList.add('asking');
  $('askq').innerHTML =
    `<b>${esc(ask.name)}</b><span>${isDef ? 'Did we get a stop?' : 'Did we get an open shot?'}</span>
     <button class="cancel" id="askcancel" aria-label="Cancel">✕</button>`;
  $('askrow').innerHTML =
    `<button class="good" id="askgood">${isDef ? 'Stop' : 'Open shot'}</button>
     <button class="bad" id="askbad">${isDef ? 'Score' : 'No'}</button>`;
  $('askcancel').onclick = () => { ask = null; renderAsk(); };
  $('askgood').onclick = () => answer(true);
  $('askbad').onclick = () => answer(false);
}
function answer(good){
  const a = ask;
  ask = null;
  const ev = {type:a.type, name:a.name};
  if (a.kind === 'defense') ev.stop = good; else ev.open = good;
  log(ev);
}

/* ============================ rendering ============================ */
function render(){
  const g = game();
  if (document.activeElement !== $('opp')) $('opp').value = g.opponent || '';
  $('gamedate').textContent =
    new Date(g.date).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}) +
    ' · ' + nEntries(g) + (nEntries(g) === 1 ? ' entry' : ' entries');

  $('periods').innerHTML = periodNames().map((n,i) =>
    `<button data-p="${i+1}" aria-pressed="${g.period===i+1}">${n==='OT'?'OT':(cfg().periodStyle==='halves'?'H':'Q')+n}</button>`).join('');

  const last = g.events[g.events.length-1];
  $('undo').disabled = !last;
  $('undotxt').textContent = last ? describe(last) : 'nothing yet';

  const def = pickEvents('defense');
  const stops = def.filter(e => e.stop).length;
  $('deftally').innerHTML = def.length
    ? `<b>${stops}</b> stops in <b>${def.length}</b> · ${pct(stops, def.length)}`
    : 'no possessions yet';

  renderCalls();
  renderAsk();
}

function card(kind, name, big){
  const set = pickEvents(kind, name);
  const n = set.length;
  let sub = '';
  if (kind === 'defense'){
    const st = set.filter(e => e.stop).length;
    sub = n ? `${st} stop${st===1?'':'s'} · ${pct(st, n)}` : 'not used yet';
  } else if (kind !== 'trigger'){
    const op = set.filter(e => e.open).length;
    sub = n ? `${op} open · ${pct(op, n)}` : 'not run yet';
  }

  const wrap = document.createElement('div');
  wrap.className = 'callwrap';
  wrap.innerHTML =
    `<button class="call${big?' big':''}${n?'':' zero'}">
       <span class="label"></span>
       <span class="n num">${n}</span>
       ${sub ? `<span class="sub">${sub}</span>` : ''}
     </button>
     <button class="minus" aria-label="Remove one ${esc(name)}">−</button>`;
  wrap.querySelector('.label').textContent = name;
  wrap.querySelector('.call').onclick = e => {
    const el = e.currentTarget;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    if (kind === 'trigger') log({type:'trigger', name:name});
    else { ask = {kind: kind === 'defense' ? 'defense' : 'play', name:name, type:kind}; renderAsk(); }
  };
  wrap.querySelector('.minus').onclick = () => removeLast(kind, name);
  return wrap;
}
function renderCalls(){
  [['defenses','defense',true], ['triggers','trigger',false], ['sets','set',false], ['blobs','blob',false]]
    .forEach(([id, kind, big]) => {
      const host = $(id); host.innerHTML = '';
      cfg()[LIST_OF[kind]].forEach(name => host.appendChild(card(kind, name, big)));
    });
}

/* ============================ header ============================ */
$('opp').addEventListener('input', e => { game().opponent = e.target.value; save(); });
$('opp').addEventListener('blur', () => render());
$('periods').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const g = game(), next = +b.dataset.p;
  if (next > g.period && g.events.some(ev => ev.period === g.period && ev.type !== 'break'))
    markBreak('period', 'start of ' + periodLabel(next));
  g.period = next; save(); render();
});
$('undo').onclick = undo;
$('scope').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  scope = b.dataset.scope;
  [...$('scope').children].forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});
$('timeout').onclick = () => {
  markBreak('timeout', 'timeout in ' + periodLabel(game().period));
  render();
  buildReport(game(), 'segment');
  openSheet('report');
};

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}
function openSheet(id){ $(id).hidden = false; }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { $(b.dataset.close).hidden = true; });
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) s.hidden = true; }));

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'z' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); undo(); return; }
  if (!ask) return;
  if (e.key === 'Enter' || e.key === 's'){ answer(true); return; }
  if (e.key === ' ' || e.key === 'x'){ e.preventDefault(); answer(false); return; }
  if (e.key === 'Escape'){ ask = null; renderAsk(); }
});

/* ============================ report ============================ */
$('openreport').onclick = () => { buildReport(game(), 'period'); openSheet('report'); };
let reportCtx = {game:null, scope:'period'};

function scopeSets(g){
  const seg = liveSegment(g);
  return {
    segment: {label:'Since ' + seg.label, events:seg.events},
    period:  {label:periodLabel(g.period), events:plain(g).filter(e => e.period === g.period)},
    game:    {label:'Whole game', events:plain(g)}
  };
}
function buildReport(g, sc){
  g = g || game();
  reportCtx = {game:g, scope:sc || 'period'};
  const sets = scopeSets(g);
  const sel = sets[reportCtx.scope] || sets.game;
  const ev = sel.events;
  const def = ev.filter(e => e.type === 'defense');
  const stops = def.filter(e => e.stop).length;
  const plays = ev.filter(e => e.type === 'set' || e.type === 'blob');
  const opens = plays.filter(e => e.open).length;
  const trig = ev.filter(e => e.type === 'trigger').length;
  const ranked = rankDefenses(def, 3);

  let html = `<div class="chips" id="scopechips">` +
    ['segment','period','game'].map(k =>
      `<button data-s="${k}" aria-pressed="${k===reportCtx.scope}">${esc(sets[k].label)}</button>`).join('') + `</div>`;

  html += `<div class="tiles">
    <div class="tile"><span class="k">Stop rate</span><b class="num">${pct(stops, def.length)}</b><span class="s">${stops} of ${def.length} trips</span></div>
    <div class="tile"><span class="k">Best defense</span><b class="num">${esc(ranked.length ? ranked[0].name : '—')}</b><span class="s">${ranked.length ? ranked[0].stops + ' of ' + ranked[0].poss + ' stops' : 'needs 3 trips each'}</span></div>
    <div class="tile"><span class="k">Triggers</span><b class="num">${trig}</b><span class="s">${esc(topName(ev,'trigger'))}</span></div>
    <div class="tile"><span class="k">Plays run</span><b class="num">${plays.length}</b><span class="s">${esc(topName(ev,'set','blob'))}</span></div>
    <div class="tile"><span class="k">Open shots</span><b class="num">${pct(opens, plays.length)}</b><span class="s">${opens} of ${plays.length} plays</span></div>
  </div>`;

  const notes = huddleNotes(ev);
  if (notes.length) html += `<div class="huddle"><h3>Worth saying</h3><ul>` +
    notes.map(n => `<li>${esc(n)}</li>`).join('') + `</ul></div>`;

  const dRows = cfg().defenses.map(name => {
    const s = def.filter(e => e.name === name);
    return [name, s.length, s.filter(e=>e.stop).length, pct(s.filter(e=>e.stop).length, s.length),
            def.length ? Math.round(s.length*100/def.length)+'%' : '—'];
  });
  dRows.push(['Total', def.length, stops, pct(stops, def.length), def.length ? '100%' : '—']);
  html += `<div class="block"><h3>Defense</h3>` + table(['','Trips','Stops','Stop%','Share'], dRows) + `</div>`;

  const pRows = cfg().sets.concat(cfg().blobs).map(name => {
    const s = plays.filter(e => e.name === name);
    return [name, s.length, s.filter(e=>e.open).length, pct(s.filter(e=>e.open).length, s.length)];
  });
  pRows.push(['Total', plays.length, opens, pct(opens, plays.length)]);
  html += `<div class="block"><h3>Sets and BLOBs</h3>` + table(['','Run','Open shots','Open%'], pRows) + `</div>`;

  const cols = periodNames().map((_,i)=>i+1).filter(p => plain(g).some(e => e.period === p));
  const use = cols.length ? cols : [g.period];
  html += `<div class="block"><h3>Triggers by period</h3>` + countTable(g,'trigger',cfg().triggers,use) + `</div>`;
  html += `<div class="block"><h3>Defense by period</h3>` + countTable(g,'defense',cfg().defenses,use) + `</div>`;

  html += `<div class="block" id="reportactions"><h3>Take it with you</h3>
    <div class="btns">
      <button class="btn primary" id="printreport">Save this report as a PDF</button>
      <button class="btn" id="copysum">Copy this report</button>
      <button class="btn" id="savecsv">Save the game as CSV</button>
    </div>
    <p class="note">On an iPad the PDF goes through the print sheet — choose Save to Files.</p></div>`;

  $('reporttitle').textContent = (g.opponent || 'Opponent') + ' · ' + sel.label;
  $('reportbody').innerHTML = html;
  $('scopechips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    buildReport(reportCtx.game, b.dataset.s);
    $('report').querySelector('.inner').scrollTop = 0;
  });
  $('printreport').onclick = () => window.print();
  $('copysum').onclick = () => copyText(summaryText(g, ev, sel.label));
  $('savecsv').onclick = () => saveCsv(g);
}
function table(head, rows){
  return '<table><thead><tr>' + head.map(h=>`<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map((c,i)=> i ? `<td class="n">${c}</td>` : `<td>${esc(c)}</td>`).join('') + '</tr>').join('') +
    '</tbody></table>';
}
function countTable(g, kind, names, cols){
  if (!names.length) return '<p class="note">Nothing set up here yet.</p>';
  const head = [''].concat(cols.map(periodLabel), ['Total']);
  const rows = names.map(n => {
    const per = cols.map(p => g.events.filter(e => e.type===kind && e.name===n && e.period===p).length);
    return [n].concat(per, [per.reduce((a,b)=>a+b,0)]);
  });
  const tot = ['Total'].concat(cols.map(p => g.events.filter(e=>e.type===kind && e.period===p).length));
  tot.push(tot.slice(1).reduce((a,b)=>a+b,0));
  rows.push(tot);
  return table(head, rows);
}
function topName(ev, ...kinds){
  const set = ev.filter(e => kinds.includes(e.type));
  if (!set.length) return 'none yet';
  const tally = {};
  set.forEach(e => tally[e.name] = (tally[e.name]||0)+1);
  const best = Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return `${best[0]} most — ${best[1]}`;
}
function rankDefenses(def, min){
  const names = [...new Set(def.map(e => e.name))];
  return names.map(n => {
    const s = def.filter(e => e.name === n);
    const st = s.filter(e => e.stop).length;
    return {name:n, poss:s.length, stops:st, rate:st/s.length};
  }).filter(d => d.poss >= (min || 1)).sort((a,b) => b.rate - a.rate || b.poss - a.poss);
}
function huddleNotes(ev){
  const out = [];
  const def = ev.filter(e => e.type === 'defense');
  const ranked = rankDefenses(def, 3);
  if (ranked.length >= 2){
    const top = ranked[0], bot = ranked[ranked.length-1];
    if (top.rate - bot.rate >= .25)
      out.push(`${top.name} is getting stops — ${top.stops} of ${top.poss}. ${bot.name} is not — ${bot.stops} of ${bot.poss}.`);
  } else if (ranked.length === 1 && ranked[0].poss >= 4){
    out.push(`${ranked[0].name}: ${ranked[0].stops} stops in ${ranked[0].poss} trips.`);
  }
  if (def.length >= 6){
    if (stopsOf(def)/def.length <= .35) out.push(`Only ${stopsOf(def)} stops in ${def.length} trips.`);
    const counts = {};
    def.forEach(e => counts[e.name] = (counts[e.name]||0)+1);
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    if (sorted.length && sorted[0][1]/def.length >= .7)
      out.push(`We have been in ${sorted[0][0]} for ${sorted[0][1]} of ${def.length} trips.`);
    const unused = cfg().defenses.filter(n => !counts[n]);
    if (unused.length && unused.length < cfg().defenses.length)
      out.push(`No ${unused.join(' or ')} yet.`);
  }
  const plays = ev.filter(e => e.type === 'set' || e.type === 'blob');
  if (plays.length >= 4){
    const opens = plays.filter(e => e.open).length;
    if (opens/plays.length <= .4) out.push(`Only ${opens} open shots out of ${plays.length} plays.`);
    const byName = {};
    plays.forEach(e => { (byName[e.name] = byName[e.name] || []).push(e); });
    const dead = Object.entries(byName).filter(([,v]) => v.length >= 3 && !v.some(e => e.open));
    if (dead.length) out.push(`${dead.map(d => d[0]).join(' and ')} has not produced an open shot.`);
  }
  return out.slice(0,4);
}
const stopsOf = def => def.filter(e => e.stop).length;

function summaryText(g, ev, label){
  ev = ev || plain(g);
  const L = [];
  L.push(`${g.opponent || 'Opponent'} — ${new Date(g.date).toLocaleDateString()}`);
  L.push(label || 'Whole game');
  const def = ev.filter(e => e.type === 'defense');
  L.push(`Defense: ${stopsOf(def)} stops in ${def.length} trips (${pct(stopsOf(def), def.length)})`);
  cfg().defenses.forEach(n => {
    const s = def.filter(e => e.name === n);
    if (s.length) L.push(`  ${n}: ${s.filter(e=>e.stop).length}/${s.length}`);
  });
  L.push(`Triggers: ${cfg().triggers.map(n => `${n} ${ev.filter(e=>e.type==='trigger'&&e.name===n).length}`).join(', ')}`);
  const plays = ev.filter(e => e.type === 'set' || e.type === 'blob');
  L.push(`Plays: ${plays.filter(e=>e.open).length} open shots out of ${plays.length}`);
  cfg().sets.concat(cfg().blobs).forEach(n => {
    const s = plays.filter(e => e.name === n);
    if (s.length) L.push(`  ${n}: ${s.filter(e=>e.open).length} open of ${s.length}`);
  });
  const notes = huddleNotes(ev);
  if (notes.length) L.push('', ...notes.map(n => '• ' + n));
  return L.join('\n');
}
function csvText(g){
  const head = ['time','period','type','name','outcome'];
  const rows = g.events.map(e => [
    new Date(e.t).toISOString(), periodLabel(e.period), e.type, e.name,
    e.type === 'defense' ? (e.stop ? 'stop' : 'score')
      : (e.type === 'set' || e.type === 'blob') ? (e.open ? 'open shot' : 'no open shot') : ''
  ]);
  return [head].concat(rows).map(r => r.map(c => {
    const s = String(c ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
}
function fileName(g, ext){
  const d = new Date(g.date);
  const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const who = (g.opponent || 'opponent').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase();
  return `${stamp}-${who}.${ext}`;
}
async function offerFile(name, text, fallbackMsg){
  try{
    if (window.claude && typeof window.claude.use === 'function'){
      const dl = await window.claude.use('downloads');
      if (dl){ await dl.save({filename:name, data:text}); toast('Saved'); return; }
    }
  }catch(err){ if (err && err.code === 'declined') return; }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:'text/plain'}));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Saved'); return;
  }catch(e){}
  copyText(text, fallbackMsg);
}
function saveCsv(g){
  if (!g.events.length){ toast('Nothing logged yet'); return; }
  offerFile(fileName(g,'csv'), csvText(g), 'CSV copied — paste it into a spreadsheet');
}
function saveBackup(){
  const d = new Date();
  const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  offerFile(`bench-backup-${stamp}.json`,
    JSON.stringify({kind:'bench-tracker', version:2, config:state.config, games:state.games}),
    'Backup copied to the clipboard');
}
function restoreBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let data;
    try{ data = JSON.parse(r.result); }catch(e){ toast('That file is not a backup'); return; }
    if (!data || !Array.isArray(data.games)){ toast('That file is not a backup'); return; }
    const hadGames = state.games.some(g => g.events.length);
    if (!hadGames && data.config) state.config = Object.assign({}, DEFAULTS.config, data.config);
    let added = 0;
    data.games.forEach(g => {
      if (!g || !g.id || !Array.isArray(g.events)) return;
      const i = state.games.findIndex(x => x.id === g.id);
      if (i >= 0) state.games[i] = g; else { state.games.push(g); added++; }
    });
    state.games.sort((a,b) => new Date(b.date) - new Date(a.date));
    save(); buildSettings(); render();
    toast(added ? `${added} game${added===1?'':'s'} added` : 'Backup merged');
  };
  r.onerror = () => toast('Could not read that file');
  r.readAsText(file);
}
function copyText(text, msg){
  const done = () => toast(msg || 'Copied');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

  $('periodStyle').value = cfg().periodStyle;
  nameEditor('edit-defenses','defenses');
  nameEditor('edit-triggers','triggers');
  nameEditor('edit-sets','sets');
  nameEditor('edit-blobs','blobs');
  gameList();
  storageNote();
}
$('periodStyle').onchange = e => {
  cfg().periodStyle = e.target.value;
  const max = periodNames().length;
  if (game().period > max) game().period = max;
  save(); render();
};
function nameEditor(hostId, key){
  const host = $(hostId); host.innerHTML = '';
  cfg()[key].forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'nameitem';
    row.innerHTML = `<input type="text" value="${esc(name)}" aria-label="Name"><button class="btn danger">Remove</button>`;
    const input = row.querySelector('input');
    input.oninput = () => {
      const old = cfg()[key][i], val = input.value;
      cfg()[key][i] = val;
      state.games.forEach(g => g.events.forEach(e => { if (e.name === old) e.name = val; }));
      save(); renderCalls();
    };
    row.querySelector('button').onclick = () => { cfg()[key].splice(i,1); save(); buildSettings(); renderCalls(); };
    host.appendChild(row);
  });
  if (!cfg()[key].length) host.innerHTML = '<p class="note">Nothing here yet.</p>';
}
function adder(btn, key, label){
  $(btn).onclick = () => { cfg()[key].push(label + ' ' + (cfg()[key].length+1)); save(); buildSettings(); renderCalls(); };
}
adder('add-defense','defenses','Defense');
adder('add-trigger','triggers','Trigger');
adder('add-set','sets','Set');
adder('add-blob','blobs','BLOB');

$('newgame').onclick = () => {
  if (!game().events.length){ toast('This game is already empty'); return; }
  newGame(); ask = null; buildSettings(); render();
  toast('New game started');
};
$('savebackup').onclick = saveBackup;
$('openbackup').onclick = () => $('backupfile').click();
$('backupfile').onchange = e => { if (e.target.files[0]) restoreBackup(e.target.files[0]); e.target.value = ''; };
function storageNote(){
  $('storagenote').textContent = storageWorks
    ? 'Games are saved on this device as you tap. A backup file is how you move one to another device.'
    : 'This browser is not letting the page save anything. Save a backup file before you close it.';
  $('storagenote').style.color = storageWorks ? '' : 'var(--danger)';
}
function deleteGame(id){
  const i = state.games.findIndex(g => g.id === id);
  if (i < 0) return;
  const wasLive = state.games[i].id === state.currentId;
  const name = state.games[i].opponent || 'that game';
  state.games.splice(i,1);
  if (wasLive){
    if (state.games.length) state.currentId = state.games[0].id;
    else { state.currentId = null; newGame(); }
    ask = null;
  }
  save(); buildSettings(); render();
  toast('Deleted ' + name);
}
function gameList(){
  const host = $('gamelist'); host.innerHTML = '';
  state.games.forEach(g => {
    const el = document.createElement('div');
    el.className = 'gameitem';
    const d = g.events.filter(e => e.type === 'defense');
    const live = g.id === state.currentId;
    el.innerHTML =
      `<div class="who"><b></b><span>${new Date(g.date).toLocaleDateString()} · ${d.length} trips · ${nEntries(g)} entries${live?' · live':''}</span></div>
       <button class="btn" data-act="open">Open</button>
       <button class="btn" data-act="report">Report</button>
       <button class="btn danger" data-act="del">Delete</button>`;
    el.querySelector('b').textContent = g.opponent || 'Untitled game';
    el.querySelector('[data-act=open]').onclick = () => {
      state.currentId = g.id; ask = null; save(); $('settings').hidden = true; render();
    };
    el.querySelector('[data-act=report]').onclick = () => { buildReport(g,'game'); $('settings').hidden = true; openSheet('report'); };
    const del = el.querySelector('[data-act=del]');
    del.onclick = () => {
      if (del.dataset.armed === '1'){ deleteGame(g.id); return; }
      host.querySelectorAll('[data-act=del]').forEach(b => { b.dataset.armed = ''; b.textContent = 'Delete'; });
      del.dataset.armed = '1';
      del.textContent = live ? 'Delete the live game?' : 'Sure?';
      clearTimeout(del._t);
      del._t = setTimeout(() => { del.dataset.armed = ''; del.textContent = 'Delete'; }, 5000);
    };
    host.appendChild(el);
  });
  if (!state.games.length) host.innerHTML = '<p class="note">No games yet.</p>';
}

render();

/* makes the installed app open with no connection at all */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
